name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Bounds a hung test run, which GitHub would otherwise cancel only after
    # 360 minutes. Node's test runner can loop forever reading a test file's
    # output when what it has buffered starts with V8's serializer header but
    # holds only part of a frame (nodejs/node#62704). The fix shipped in
    # 24.18.0 and 26.2.0, and no 22.x release has it as of 22.23.3, so the
    # floor legs can hit it. Green legs here take under two minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Both platforms: a package-lock.json regenerated over an existing
      # node_modules tree records only that machine's native binaries, so a
      # lock made on macOS breaks Linux installs and vice versa. Each runner
      # catches the lock the other's platform produced.
      # Node: both ends of the range package.json's engines admits, its floor
      # pinned exactly (keep the two in step) and the newest release, and on
      # ubuntu also each maintained line between those two majors (24 today).
      # stdio flushing semantics around process exit, and the built-in fetch,
      # differ between versions and platforms.
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.12.0', 'latest']
        include:
          - os: ubuntu-latest
            node: '24'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      # npm ci installs the lock verbatim: npm >= 11 'npm install' silently
      # re-resolves platform packages missing from the lock, so only npm ci
      # fails loudly on a broken or out-of-sync lockfile.
      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Tests run on both platforms: process/stdio behaviour differs (pipes
      # are asynchronous on macOS), and ubuntu-only runs have missed that.
      - name: Test
        run: npm test
