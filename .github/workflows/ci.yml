name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Each '22.12.0' is package.json's engines floor, pinned exactly: keep
      # them in step with it. Both platforms install: a package-lock.json
      # regenerated over an existing node_modules tree records only that
      # machine's native binaries, so a lock made on macOS breaks Linux
      # installs and vice versa.
      matrix:
        include:
          - { os: ubuntu-latest, node: '22.12.0', suite: true }
          - { os: ubuntu-latest, node: 'latest' }
          - { os: ubuntu-latest, node: '24' }
          - { os: macos-latest, node: '22.12.0' }
          - { os: macos-latest, node: 'latest' }

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      # npm ci installs the lock verbatim: npm >= 11 'npm install' silently
      # re-resolves platform packages missing from the lock, so only npm ci
      # fails loudly on a broken or out-of-sync lockfile.
      - name: Install dependencies (strict lockfile)
        id: install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start without credentials
        timeout-minutes: 2
        run: |
          status=0
          node dist/src/index.js --stdio </dev/null >start-stdout.txt 2>start-stderr.txt || status=$?
          printf '%s\n' 'SLACK_BOT_TOKEN and SLACK_APP_TOKEN environment variables are required' >start-expected.txt
          if [ "$status" != 1 ] || ! cmp -s start-stderr.txt start-expected.txt || [ -s start-stdout.txt ]; then
            echo "exit $status"; echo '--- stderr'; cat start-stderr.txt; echo '--- stdout'; cat start-stdout.txt
            exit 1
          fi

      - name: Test
        if: ${{ !cancelled() && matrix.suite && steps.install.outcome == 'success' }}
        run: npm test
